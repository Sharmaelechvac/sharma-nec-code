<script>
/* Sharma kit v1.2 adapter: service worker + bottom tab bar wired to this app's
   existing [data-tab] buttons. No content, data or behaviour change. */
(function(){
  function reg(){ if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) { try { navigator.serviceWorker.register("sw.js", { scope: "/sharma-nec-code/" }).catch(function(){}); } catch(e){} } }
  if (document.readyState === "complete") reg(); else addEventListener("load", reg);
  var tabs = document.querySelectorAll(".sk-tab[data-sk-tab]");
  function sync(){
    var on = document.querySelector('[data-tab].on');
    tabs.forEach(function(t){
      if (on && t.getAttribute("data-sk-tab") === on.getAttribute("data-tab")) t.setAttribute("aria-current","page");
      else t.removeAttribute("aria-current");
    });
  }
  tabs.forEach(function(t){
    t.addEventListener("click", function(e){
      e.preventDefault();
      var b = document.querySelector('[data-tab="' + t.getAttribute("data-sk-tab") + '"]');
      if (b) b.click();
      sync();
    });
  });
  document.addEventListener("click", function(){ setTimeout(sync, 30); });
  var ap = document.getElementById("appearance");
  function mountScheme(){ if (ap && window.SK && SK.scheme) SK.scheme.mountToggle(ap); }
  if (window.SK) mountScheme(); else addEventListener("load", mountScheme);
  sync();
})();
</script>
